<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Report</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; padding: 10px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 1000px; margin: auto; }
        h2 { color: #2e7d32; text-align: center; }
        
        /* Stats Dashboard */
        .dashboard { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; }
        .stat-card { background: #2e7d32; color: white; padding: 15px; border-radius: 8px; text-align: center; width: 150px; }
        
        .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
        select, input, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #2e7d32; color: white; border: none; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { background: #eee; padding: 10px; text-align: left; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        .status-p { color: green; font-weight: bold; }
        .status-a { color: red; font-weight: bold; }
        
        /* Modal Photo View */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal img { max-width: 90%; max-height: 80%; border-radius: 8px; }
        .close-modal { position: absolute; top: 20px; right: 30px; color: white; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>Barsoi Public School</h2>
    <p style="text-align:center;">Daily Attendance Tracking</p>
    
    <div class="dashboard">
        <div class="stat-card">Total: <span id="totalCount">0</span></div>
        <div class="stat-card" style="background:#4caf50;">Present: <span id="presentCount">0</span></div>
    </div>

    <div class="filters">
        <select id="classList">
            <option value="1">Teachers</option>
            <option value="2">Non-Teaching</option>
        </select>
        <input type="date" id="datePicker">
        <button onclick="generateReport()">Generate Report</button>
    </div>

    <div style="overflow-x:auto;">
        <table id="reportTable">
            <thead>
                <tr>
                    <th>Name</th><th>Status</th><th>Photo</th><th>In</th><th>Out</th><th>Duration</th>
                </tr>
            </thead>
            <tbody id="reportBody"></tbody>
        </table>
    </div>
</div>

<!-- Photo Modal -->
<div id="photoModal" class="modal" onclick="this.style.display='none'">
    <span class="close-modal">&times;</span>
    <img id="modalImg" src="">
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzrc76WSQb88-ZRsZ1aQq5NznavtMkBWAp-OTLNgrgUDzsHlrk6fdpefvlrzNoeAxB/exec"; 

    function openPhoto(id) {
        if(!id || id === 'undefined') return;
        document.getElementById('modalImg').src = `https://drive.google.com/uc?export=view&id=${id}`;
        document.getElementById('photoModal').style.display = 'flex';
    }

    async function generateReport() {
        let cid = document.getElementById('classList').value;
        let date = document.getElementById('datePicker').value;
        let tbody = document.getElementById('reportBody');
        
        tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Loading...</td></tr>";

        // 1. Saare teachers ke naam layen
        let allStaff = await fetch(SCRIPT_URL + "?classId=" + cid).then(r => r.json());
        // 2. Attendance logs layen
        let logs = await fetch(`${SCRIPT_URL}?getAttendance=true&classId=${cid}&name=all&date=${date}`).then(r => r.json());

        tbody.innerHTML = "";
        let present = 0;

        allStaff.forEach(staffName => {
            // Check karein kya ye teacher attendance log me hai?
            let record = logs.find(l => l[0].toLowerCase() === staffName.toLowerCase());
            
            let tr = document.createElement('tr');
            if(record) {
                present++;
                tr.innerHTML = `
                    <td>${record[0]}</td>
                    <td class="status-p">Present</td>
                    <td><span style="cursor:pointer; color:blue;" onclick="openPhoto('${record[6]}')">👁️ View</span></td>
                    <td>${record[1].split(' ')[1]}</td>
                    <td>${record[2]}</td>
                    <td>${record[5]}</td>
                `;
            } else {
                tr.innerHTML = `
                    <td>${staffName}</td>
                    <td class="status-a">Absent</td>
                    <td>-</td><td>-</td><td>-</td><td>-</td>
                `;
            }
            tbody.appendChild(tr);
        });

        document.getElementById('totalCount').innerText = allStaff.length;
        document.getElementById('presentCount').innerText = present;
    }
</script>
</body>
</html>
