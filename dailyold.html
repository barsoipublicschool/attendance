<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Report - Barsoi Public School</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; padding: 10px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 1000px; margin: auto; }
        h2 { color: #2e7d32; text-align: center; margin-bottom: 5px; }
        
        /* Stats Dashboard */
        .dashboard { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; }
        .stat-card { background: #2e7d32; color: white; padding: 12px 20px; border-radius: 8px; text-align: center; font-weight: bold; }
        
        .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
        select, input, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        button { background: #2e7d32; color: white; border: none; cursor: pointer; font-weight: bold; }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; text-align: left; }
        th { background: #e8f5e9; color: #2e7d32; padding: 10px; border-bottom: 2px solid #a5d6a7; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
        .status-p { color: green; font-weight: bold; }
        .status-a { color: red; font-weight: bold; }
        
        /* Modal Photo View */
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; flex-direction: column; }
        .modal-content { max-width: 85%; max-height: 75vh; border-radius: 12px; border: 3px solid white; box-shadow: 0 5px 25px rgba(0,0,0,0.5); object-fit: contain; }
        .close-modal { position: absolute; top: 20px; right: 25px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; }
        .view-btn { cursor: pointer; color: #1565c0; background: #e3f2fd; padding: 4px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>

<div class="card">
    <h2>Barsoi Public School</h2>
    <p style="text-align:center; font-weight:bold; color:#555; margin-top:0;">Daily Attendance Tracking</p>
    
    <div class="dashboard">
        <div class="stat-card" style="background:#1565c0;">Total: <span id="totalCount">0</span></div>
        <div class="stat-card" style="background:#2e7d32;">Present: <span id="presentCount">0</span></div>
    </div>

    <div class="filters">
        <select id="classList">
            <option value="1">Teachers</option>
            <option value="2">Non-Teaching</option>
        </select>
        <input type="date" id="datePicker">
        <button onclick="generateReport()">Generate Report</button>
    </div>

    <div class="table-container">
        <table id="reportTable">
            <thead>
                <tr>
                    <th>Name</th><th>Status</th><th>Photo</th><th>In Time</th><th>Out Time</th><th>In Loc</th><th>Out Loc</th><th>Duration</th>
                </tr>
            </thead>
            <tbody id="reportBody">
                <tr><td colspan="8" style="text-align:center; color:#777;">Select the date and click 'Generate Report.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Photo Modal -->
<div id="photoModal" class="modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img id="modalImg" class="modal-content" src="">
</div>

<script>
    // URL wahi hai jo aapne pichli baar use kiya tha
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzrc76WSQb88-ZRsZ1aQq5NznavtMkBWAp-OTLNgrgUDzsHlrk6fdpefvlrzNoeAxB/exec"; 

    document.getElementById('datePicker').valueAsDate = new Date();

    function openPhoto(photoId) {
        if(!photoId || photoId === '' || photoId === 'undefined') return;
        document.getElementById('modalImg').src = `https://lh3.googleusercontent.com/d/${photoId}`;
        document.getElementById('photoModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('photoModal').style.display = 'none';
        document.getElementById('modalImg').src = "";
    }

    async function generateReport() {
        let cid = document.getElementById('classList').value;
        let date = document.getElementById('datePicker').value;
        let tbody = document.getElementById('reportBody');
        
        if(!date) { alert("Kripya Date select karein!"); return; }

        tbody.innerHTML = "<tr><td colspan='8' style='text-align:center;'>Loading Data... ⏳</td></tr>";

        try {
            let allStaff = await fetch(SCRIPT_URL + "?classId=" + cid).then(r => r.json());
            let logs = await fetch(`${SCRIPT_URL}?getAttendance=true&classId=${cid}&name=all&date=${date}`).then(r => r.json());

            tbody.innerHTML = "";
            let present = 0;

            allStaff.forEach(staffName => {
                let record = logs.find(l => l[0].toString().trim().toLowerCase() === staffName.toString().trim().toLowerCase());
                
                let tr = document.createElement('tr');
                if(record) {
                    present++;
                    let photoId = record[6] || ""; 
                    
                    tr.innerHTML = `
                        <td><b>${record[0]}</b></td>
                        <td class="status-p">Present</td>
                        <td>${photoId ? `<span class="view-btn" onclick="openPhoto('${photoId}')">👁️ View</span>` : '-'}</td>
                        <td>${record[1] ? record[1].split(' ')[1] : '-'}</td>
                        <td>${record[2] || '-'}</td>
                        <td>${record[3] || '-'}</td>
                        <td>${record[4] || '-'}</td>
                        <td>${record[5] || '-'}</td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td style="color:#555;">${staffName}</td>
                        <td class="status-a">Absent</td>
                        <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                    `;
                }
                tbody.appendChild(tr);
            });

            document.getElementById('totalCount').innerText = allStaff.length;
            document.getElementById('presentCount').innerText = present;

        } catch(err) {
            tbody.innerHTML = "<tr><td colspan='8' style='text-align:center; color:red;'>Data load failed.</td></tr>";
        }
    }
</script>
</body>
</html>
