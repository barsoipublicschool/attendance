<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Attendance - Barsoi Public School</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; padding: 10px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 1100px; margin: auto; }
        h2 { color: #2e7d32; text-align: center; }
        
        .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
        select, input, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #2e7d32; color: white; border: none; cursor: pointer; font-weight: bold; }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th { background: #e8f5e9; color: #2e7d32; padding: 8px; border: 1px solid #ddd; text-align: left; }
        td { padding: 6px; border: 1px solid #eee; text-align: left; }
        
        .status-p { color: green; font-weight: bold; }
        .status-a { color: red; font-weight: bold; }
        .status-off { color: #555; background: #f0f0f0; font-style: italic; font-weight: bold; }
        .view-btn { cursor: pointer; color: #1565c0; text-decoration: underline; font-weight: bold; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
        .modal-content { max-width: 90%; max-height: 80vh; border-radius: 8px; border: 3px solid white; }
    </style>
</head>
<body>

<div class="card">
    <h2>Monthly Attendance Report</h2>
    <div class="filters">
        <select id="classList" onchange="loadStaff()">
            <option value="1">Teachers</option>
            <option value="2">Non-Teaching</option>
        </select>
        <select id="sList"></select>
        <input type="month" id="monthPicker">
        <button onclick="generateMonthlyReport()">Show Report</button>
    </div>

    <div class="table-container">
        <table id="reportTable">
            <thead>
                <tr>
                    <th>Date</th><th>Day</th><th>Status</th><th>In</th><th>Out</th>
                    <th>In-Loc</th><th>Out-Loc</th><th>Photo</th><th>Duration</th>
                </tr>
            </thead>
            <tbody id="reportBody"></tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="photoModal" class="modal" onclick="this.style.display='none'">
    <img id="modalImg" class="modal-content" src="">
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzrc76WSQb88-ZRsZ1aQq5NznavtMkBWAp-OTLNgrgUDzsHlrk6fdpefvlrzNoeAxB/exec"; // <--- Yahan apna SCRIPT_URL dalen

    window.onload = () => {
        document.getElementById('monthPicker').value = new Date().toISOString().slice(0, 7);
        loadStaff();
    };

    function loadStaff() {
        let cid = document.getElementById('classList').value;
        let sl = document.getElementById('sList');
        fetch(SCRIPT_URL + "?classId=" + cid).then(r => r.json()).then(data => {
            sl.innerHTML = "";
            data.forEach(n => sl.innerHTML += `<option value="${n}">${n}</option>`);
        });
    }

    function openPhoto(id) {
        if(!id) return;
        document.getElementById('modalImg').src = `https://lh3.googleusercontent.com/d/${id}`;
        document.getElementById('photoModal').style.display = 'flex';
    }

    async function generateMonthlyReport() {
        let cid = document.getElementById('classList').value;
        let staffName = document.getElementById('sList').value;
        let [year, month] = document.getElementById('monthPicker').value.split('-');
        let tbody = document.getElementById('reportBody');
        
        tbody.innerHTML = "<tr><td colspan='9' style='text-align:center;'>Loading...</td></tr>";

        let logs = await fetch(`${SCRIPT_URL}?getAttendance=true&classId=${cid}&name=${staffName}`).then(r => r.json());

        tbody.innerHTML = "";
        let daysInMonth = new Date(year, month, 0).getDate();

        for (let day = 1; day <= daysInMonth; day++) {
            let d = new Date(year, month - 1, day);
            let dateStr = d.toISOString().split('T')[0]; // YYYY-MM-DD
            let dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
            
            // Log dhundna
            let record = logs.find(l => l[1].split(' ')[0].split('/').reverse().join('-') === dateStr);
            
            let tr = document.createElement('tr');
            
            if (d.getDay() === 0) { // Sunday
                tr.innerHTML = `<td>${dateStr}</td><td>${dayName}</td><td class="status-off">Week Off</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>`;
            } 
            else if (record) { // Present
                tr.innerHTML = `
                    <td>${dateStr}</td><td>${dayName}</td><td class="status-p">Present</td>
                    <td>${record[1].split(' ')[1]}</td>
                    <td>${record[2]}</td>
                    <td>${record[3] || '-'}</td>
                    <td>${record[4] || '-'}</td>
                    <td><span class="view-btn" onclick="openPhoto('${record[6]}')">👁️ View</span></td>
                    <td>${record[5]}</td>
                `;
            } 
            else if (d < new Date().setHours(0,0,0,0)) { // Absent
                tr.innerHTML = `<td>${dateStr}</td><td>${dayName}</td><td class="status-a">Absent</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>`;
            }
            else { // Future
                tr.innerHTML = `<td>${dateStr}</td><td>${dayName}</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>`;
            }
            tbody.appendChild(tr);
        }
    }
</script>
</body>
</html>
