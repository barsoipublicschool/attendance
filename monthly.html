<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Attendance - Barsoi Public School</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; padding: 10px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 900px; margin: auto; }
        h2 { color: #2e7d32; text-align: center; margin-bottom: 5px; }
        
        .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
        select, input, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #2e7d32; color: white; border: none; cursor: pointer; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { background: #e8f5e9; color: #2e7d32; padding: 10px; border: 1px solid #ddd; }
        td { padding: 8px; border: 1px solid #eee; }
        
        .status-p { color: green; font-weight: bold; }
        .status-a { color: red; font-weight: bold; }
        .status-off { color: #555; background: #f0f0f0; font-style: italic; }
    </style>
</head>
<body>

<div class="card">
    <h2>Monthly Report</h2>
    <div class="filters">
        <select id="classList" onchange="loadStaff()">
            <option value="1">Teachers</option>
            <option value="2">Non-Teaching</option>
        </select>
        <select id="sList"></select>
        <input type="month" id="monthPicker">
        <button onclick="generateMonthlyReport()">Show Report</button>
    </div>

    <div style="overflow-x:auto;">
        <table id="reportTable">
            <thead>
                <tr>
                    <th>Date</th><th>Day</th><th>Status</th><th>In</th><th>Out</th><th>Duration</th>
                </tr>
            </thead>
            <tbody id="reportBody"></tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzrc76WSQb88-ZRsZ1aQq5NznavtMkBWAp-OTLNgrgUDzsHlrk6fdpefvlrzNoeAxB/exec"; // Yahan apna URL dalen

    window.onload = () => {
        document.getElementById('monthPicker').value = new Date().toISOString().slice(0, 7);
        loadStaff();
    };

    function loadStaff() {
        let cid = document.getElementById('classList').value;
        let sl = document.getElementById('sList');
        fetch(SCRIPT_URL + "?classId=" + cid).then(r => r.json()).then(data => {
            sl.innerHTML = "";
            data.forEach(n => sl.innerHTML += `<option value="${n}">${n}</option>`);
        });
    }

    async function generateMonthlyReport() {
        let cid = document.getElementById('classList').value;
        let staffName = document.getElementById('sList').value;
        let [year, month] = document.getElementById('monthPicker').value.split('-');
        let tbody = document.getElementById('reportBody');
        
        tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Loading...</td></tr>";

        // Saara data fetch karein (date parameter empty chhodne se sab aa jayega)
        let logs = await fetch(`${SCRIPT_URL}?getAttendance=true&classId=${cid}&name=${staffName}`).then(r => r.json());

        tbody.innerHTML = "";
        let daysInMonth = new Date(year, month, 0).getDate();

        for (let day = 1; day <= daysInMonth; day++) {
            let dateStr = `${year}-${month.padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
            let d = new Date(year, month - 1, day);
            let dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
            
            let record = logs.find(l => l[1].split(' ')[0].split('/').reverse().join('-') === dateStr);
            
            let tr = document.createElement('tr');
            
            // Logic: Sunday check
            if (d.getDay() === 0) {
                tr.innerHTML = `<td>${dateStr}</td><td>${dayName}</td><td class="status-off">Week Off</td><td>-</td><td>-</td><td>-</td>`;
            } 
            // Logic: Present check
            else if (record) {
                tr.innerHTML = `<td>${dateStr}</td><td>${dayName}</td><td class="status-p">Present</td><td>${record[1].split(' ')[1]}</td><td>${record[2]}</td><td>${record[5]}</td>`;
            } 
            // Logic: Absent check (Agar date aaj se pehle ki hai)
            else if (d < new Date().setHours(0,0,0,0)) {
                tr.innerHTML = `<td>${dateStr}</td><td>${dayName}</td><td class="status-a">Absent</td><td>-</td><td>-</td><td>-</td>`;
            }
            // Logic: Future dates
            else {
                tr.innerHTML = `<td>${dateStr}</td><td>${dayName}</td><td>-</td><td>-</td><td>-</td><td>-</td>`;
            }
            tbody.appendChild(tr);
        }
    }
</script>
</body>
</html>
